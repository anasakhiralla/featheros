
name: Build FeatherOS ISO
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build the ISO inside Debian 13
        run: |
          docker run --rm --privileged -v "$PWD":/work -w /work debian:trixie bash build.sh
      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: featheros-iso
          path: out/featheros-amd64.iso
          retention-days: 7
          compression-level: 0
